name: Update keyless coastal context

on:
  schedule:
    - cron: '33 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-coastal-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHROME_CHANNEL: chrome
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Record the checked-out main revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: google-chrome --version
      - name: Reacquire public basin, Census and annual treatment-flow context
        run: python scripts/refresh_coastal_impact.py
        timeout-minutes: 15
      # The built-in token's data commit does not start push CI or Pages itself.
      - run: python scripts/refresh_coastal_impact.py --check
      - run: python scripts/check_catalog.py
      - run: python scripts/embed_response_plans.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh_fred.py --check
      - run: npm test
        timeout-minutes: 20
      - name: Commit only validated coastal context
        id: target
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$remote_main" != "$BASE_SHA" ]; then
            echo 'Main advanced during validation; refusing to overwrite or rebase. Run again from current main.' >&2
            exit 1
          fi
          git add -- consoles/coastal-water-resilience/index.html consoles/coastal-water-resilience/data/impact-context.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh public coastal impact context'
            git push origin HEAD:refs/heads/main
          else
            echo 'Public coastal context is unchanged; no data commit.'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish or recover Pages and verify the coastal payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: python scripts/publish_grid_pages.py --repository "$GITHUB_REPOSITORY" --commit "$TARGET_SHA" --data-path consoles/coastal-water-resilience/data/impact-context.json --timeout-seconds 720
        timeout-minutes: 15
