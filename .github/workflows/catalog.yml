name: Catalog checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main revision requested by a validated data publisher
        required: false
        type: string
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify a dispatched publisher's revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo 'Main changed before validation started; rerun the source publisher.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python scripts/check_catalog.py
      - run: python scripts/embed_response_plans.py --check
      - run: python scripts/embed_worldbank_runtime.py --check
      - run: python scripts/embed_health_runtime.py --check
      - run: python scripts/embed_coastal_runtime.py --check
      - run: python scripts/refresh_coastal_impact.py --check
      - run: python scripts/refresh_nhs.py --check
      - run: python scripts/refresh_worldbank_context.py --check
      - run: node scripts/refresh_health_snapshots.mjs --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh_fred.py --check
  keyless-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: npm test
        timeout-minutes: 20
  deploy:
    needs: [catalog, keyless-browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Package the exact tested commit
        run: |
          mkdir -p "$RUNNER_TEMP/validated-site"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/validated-site"
          python -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"validated-site","build-info.json").write_text(json.dumps({"commit":os.environ["GITHUB_SHA"],"validation":"catalog-and-browser"})+"\n")'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/validated-site
      - name: Refuse a superseded main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
