name: Catalog checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python scripts/check_catalog.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh_fred.py --check
  keyless-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Report the installed runner browser
        run: google-chrome --version
      - run: npm test
