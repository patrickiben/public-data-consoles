name: Update public FRED macro data

on:
  schedule:
    - cron: '43 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-fred-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CHROME_CHANNEL: chrome
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Record checked-out main
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: google-chrome --version
      - name: Download and validate all pinned official FRED series
        run: python scripts/refresh_fred.py --automated --github-output "$GITHUB_OUTPUT"
        timeout-minutes: 10
      # Built-in-token pushes do not start push CI; validate before committing.
      - run: python scripts/refresh_fred.py --check
      - run: python scripts/check_catalog.py
      - run: python scripts/embed_response_plans.py --check
      - run: python scripts/embed_worldbank_runtime.py --check
      - run: python scripts/embed_health_runtime.py --check
      - run: python scripts/refresh_coastal_impact.py --check
      - run: python scripts/refresh_nhs.py --check
      - run: python -m unittest discover -s tests -v
      - run: npm test
        timeout-minutes: 20
      - name: Commit only validated macro data and dated guide
        id: target
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$remote_main" != "$BASE_SHA" ]; then
            echo 'Main advanced during validation; refusing to overwrite or rebase. Run again from current main.' >&2
            exit 1
          fi
          git add -- consoles/resilience-telemetry/index.html consoles/resilience-telemetry/wiki.html consoles/resilience-telemetry/data/fred_snapshot.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh public FRED macro observations'
            git push origin HEAD:refs/heads/main
          else
            echo 'FRED observations and provenance unchanged; no data commit.'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish or recover Pages and verify public macro JSON
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: python scripts/publish_grid_pages.py --repository "$GITHUB_REPOSITORY" --commit "$TARGET_SHA" --data-path consoles/resilience-telemetry/data/fred_snapshot.json --timeout-seconds 2400
        timeout-minutes: 45
